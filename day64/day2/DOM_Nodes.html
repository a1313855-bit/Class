<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>DOM Nodes Example</title>

</head>

<body>
    <button onclick="show()">DOM Nodes</button>
    <button onclick="showDiv()">Show Division</button>
    <div id="foo"><p>P1</p><span>Span1</span><p>P2</p></div>
    <div id="foo2"></div>
    <div id="foo2"><span>Span2</span></div>
    <script>
        function show() {
            let foo = document.getElementById('foo');
            if (foo.hasChildNodes()) {
                let children = foo.childNodes;
                for (let i = 0; i < children.length; ++i) {
                    console.log("log1 " + children[i].innerHTML);   // P1 / Span1 / P2
                    console.log("log2 " + children[i].nodeName);    // P / SPAN / P
                }
            }
        }
        function showDiv() {
            let foo2 = document.getElementById('foo2');
            alert(foo2.innerHTML);
            foo2.innerHTML = "<h3 style='coler:red'>New Content</h3>"
        }
    </script>
</body>

</html
