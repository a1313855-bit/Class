<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>DOM Table Example</title>
</head>

<body>
    <button onclick="addTable()">Add Table</button>
    <button onclick="addTable2()">Add Table 2</button>
    <table id="tb1" border="0" width="30%"></table>
    <script>
        const addTable = () => {
            let table = document.createElement("table");
            table.border = "1";
            for (let i = 1; i <= 3; i++) {
                let tr = document.createElement("tr");
                for (let j = 1; j <= 3; j++) {
                    let td = document.createElement("td");
                    td.innerHTML = "Row" + i + "Col" + j;
                    tr.appendChild(td);
                }
                table.appendChild(tr);
            }
            document.body.appendChild(table);
        }
        const addTable2 = () => {
            // 新增表格列
            var table = document.getElementById('tb1');
            table.border = "1";
            var newRow = table.insertRow(-1);       // -1 = 加到最後一列
            var cell1 = newRow.insertCell();
            cell1.textContent = 'Book Name';
            var cell2 = newRow.insertCell();
            cell2.textContent = 'Book Price';
            newRow = table.insertRow(-1);       // -1 = 加到最後一列
            cell1 = newRow.insertCell();
            cell1.textContent = 'JavaScript Programming';
            cell2 = newRow.insertCell();
            cell2.textContent = '$30';
        }
    </script>
</body>

</html>
