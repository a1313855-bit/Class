<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Array Example</title>
</head>

<body>
    <button onclick="showArray()">Show Array</button>
    <script>
        function showArray() {
            let number = [1, 2, 3, 4, 5];
            for (let i = 0; i < number.length; i++) {
                console.log(number[i]);
            }
        }
    </script>
</body>

</html>
