<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>BOM IMAGES</title>

</head>

<body>
    <!-- <img id="img" src="images/banana.png" width="320px" height="200px" /> -->
    <img id="images" src="test_images/stickman_01.png" width="720px" height="600px" />
    <button onclick="startImage()">Start Clock</button>
    <button onclick="stopImage()">Stop Clock</button>
    <script>
        let index = 1;
        let intervalId;
        let images = [
            'test_images/stickman_01.png', 'test_images/stickman_02.png', 'test_images/stickman_03.png',
            'test_images/stickman_04.png', 'test_images/stickman_05.png', 'test_images/stickman_06.png',
            'test_images/stickman_07.png', 'test_images/stickman_08.png', 'test_images/stickman_09.png',
            'test_images/stickman_10.png', 'test_images/stickman_11.png', 'test_images/stickman_12.png',
            'test_images/stickman_13.png', 'test_images/stickman_14.png', 'test_images/stickman_15.png',
            'test_images/stickman_16.png', 'test_images/stickman_17.png', 'test_images/stickman_18.png',
            'test_images/stickman_19.png', 'test_images/stickman_20.png', 'test_images/stickman_21.png',
            'test_images/stickman_22.png', 'test_images/stickman_23.png', 'test_images/stickman_24.png',
            'test_images/stickman_25.png', 'test_images/stickman_26.png', 'test_images/stickman_27.png',
            'test_images/stickman_28.png', 'test_images/stickman_29.png', 'test_images/stickman_30.png'];
        const startImage = function () {
            intervalId = window.setInterval(changeImege, 250);
        }
        const stopImage = function () {
            window.clearInterval(intervalId);
        }
        const changeImege = function () {
            document.getElementById('images').src = images[index];
            index++;
            index %= images.length;
        }

    </script>
</body>

</html>
