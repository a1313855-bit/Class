<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>JQuery Basic</title>
    <script src="//ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  </head>

  <body>
    <button id="b1">GET</button>
    <button id="b2">SET</button>
    <button id="b3">Change CSS</button><br />
    <span id="test">id Test</span><br />
    <input type="text" id="input1" value="Input Test" />
    <p class="p1">p Test</p>
  </body>
  <script>
    const buttonClick = () => {
      const text = $("#test").text();
      const inputVal = $("#input1").val();
      console.log(text);
      console.log(inputVal);
    };
    const start = () => {
      $("#b1").click(buttonClick);
      $("#b2").click(() => {
        $("#test").text("New Text");
        $("#input1").val("New Input Value");
      });
      $("#b3").click(() => {
        $(".p1").css({
          color: "red",
          "font-size": "30px",
        });
      });
    };
    $(document).ready(start);
  </script>
</html>
