<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Change CSS</title>
  </head>

  <body>
    <button onclick="changeCSS()">Change CSS</button>
    <p id="head2">Change CSS</p>
    <script>
      const changeCSS = function () {
        let hand2 = document.querySelector("#head2");
        head2.style.color = "red";
        head2.style.backgroundColor = "blue";
        head2.style.fontSize = "40px";
      };
    </script>
  </body>
</html>
