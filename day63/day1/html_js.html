<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>我的第一個 JS 頁面</title>
</head>

<body>
    <h1>Execute JavaScript</h1>
    <script type="text/javascript">
        function sum(n) {
            let value = 0;
            for (let i = 1; i <= n; i++) {
                value += i;
            }
            console.log(value);
            alert(value);
        }
        sum(10);
    </script>
</body>

</html>
