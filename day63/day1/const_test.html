<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Const Test</title>
</head>

<body>
    <button onclick="myFunction()">Click Me!</button>
    <button onclick="myFunction2()">Click Me!</button>
</body>
<script>
    function myFunction() {
        const carName = "Volvo";
        alert(carName);
        carName = "Toyota"; // 宣告 const 不可重新指派值
    }

    function myFunction2() {
        const x = [1, 2, 3];
        x[0] = 10; // 這裡修改的是陣列中的值 (記憶體未被改變)
        alert(x);
        const y = [4, 5, 6];
        y = [7, 8, 9]; // 陣列y 不可被重新宣告 (記憶體改變) 
    }
</script>

</html>
